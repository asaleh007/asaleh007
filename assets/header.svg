<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
<title id="title">Abdelrahman Ahmed Saleh</title><desc id="desc">Web Developer in Cairo, Egypt. A tiny gold pixel explorer walks along a circuit trace.</desc>
